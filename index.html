function mpResult(r){let a=0,b=0,used={host:[],guest:[]};for(let j=0;j<3;j++){let x=r.host.moves?.[j],y=r.guest.moves?.[j];if(!x?.reveal||!y?.reveal)return {a,b,round:j,used,done:false};let i=x.reveal.i,l=y.reveal.i;if(!r.host.deck[i]||!r.guest.deck[l]||used.host.includes(i)||used.guest.includes(l))return {error:'Invalid move'};used.host.push(i);used.guest.push(l);let k=r.categories[j],v=r.mode==='real'?realValues(r.host.deck[i])[k]:score(r.host.deck[i],k),w=r.mode==='real'?realValues(r.guest.deck[l])[k]:score(r.guest.deck[l],k);if(r.mode==='real'&&(k===2||k===4)){v=-v;w=-w}if(v>w)a++;if(w>v)b++;if(a===2||b===2||j===2)return {a,b,done:true,used,round:j}}}
async function mpConnect(){if(fb)return fb;let cfg=window.CAR_FIREBASE;if(!cfg?.apiKey||!cfg?.databaseURL)throw Error('Multiplayer needs Firebase setup. See the setup guide.');let base='https://www.gstatic.com/firebasejs/10.14.1/';let [app,auth,db]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-database.js')]);let instance=app.initializeApp(cfg),au=auth.getAuth(instance);await auth.signInAnonymously(au);fb={...db,db:db.getDatabase(instance),uid:au.currentUser.uid};return fb}
function mpRef(path=''){return fb.ref(fb.db,'rooms/'+mp.code+(path?'/'+path:''))}
function mpDeck(mode){let d=(mode==='real'?s.realDeck:s.deck).map(get);if(d.length<3||d.length>5||mode==='real'&&(d.length!==3||!d.every(eligible)))throw Error('Choose a valid deck in Garage first.');return d.map(c=>({t:c.t,i:c.i,lv:c.lv,pro:!!c.pro}))}
async function mpHash(i,salt){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(i+':'+salt)))).map(x=>x.toString(16).padStart(2,'0')).join('')}
function mpRandom(n){return Array.from(crypto.getRandomValues(new Uint8Array(n))).map(x=>x.toString(16).padStart(2,'0')).join('')}
let mpProcessing=false;
async function mpWatch(){if(unsub)unsub();unsub=fb.onValue(mpRef(),async snap=>{mp.room=snap.val();let r=mp.room;if(!r){mp.status='Room closed.';if(tab==='Online')render();return}if(r.host.ready&&r.guest?.ready&&!mpProcessing){mpProcessing=true;try{let result=mpResult(r);if(!result.done&&!result.error){let j=result.round,me=r[mp.role],other=r[mp.role==='host'?'guest':'host'];if(me.moves?.[j]?.hash&&other.moves?.[j]?.hash&&!me.moves[j].reveal){let secret=JSON.parse(sessionStorage.getItem('mp:'+mp.code+':'+j)||'null');if(secret){mpProcessing=false;await fb.set(mpRef(mp.role+'/moves/'+j+'/reveal'),secret);}else mp.status='Choice secret lost; start a new room.'}}else if(result.done){for(let j=0;j<=result.round;j++)for(let role of ['host','guest']){let m=r[role].moves[j];if(await mpHash(m.reveal.i,m.reveal.salt)!==m.hash)throw Error('Invalid opponent commitment.')}s.pvp??={w:0,l:0,d:0,seen:{}};s.pvp.seen??={};if(!s.pvp.seen[mp.code]){s.pvp.seen[mp.code]=true;let v=mp.role==='host'?result.a-result.b:result.b-result.a;s.pvp[v===0?'d':v>0?'w':'l']++;save()}}}catch(e){mp.status=e.message}finally{mpProcessing=false}}if(tab==='Online')render()},e=>{mp.status=e.message;if(tab==='Online')render()})}
async function mpAction(a,v){if(mp.busy)return;mp.busy=true;try{if(a==='mpleave'){if(unsub)unsub();unsub=null;mp.room=null;mp.code='';mp.status='';return}if(a==='mpcopy'){await navigator.clipboard.writeText(mp.code);mp.status='Code copied';return}let code=document.querySelector('#mp-code')?.value.trim().toUpperCase(),mode=document.querySelector('#mp-mode')?.value||mp.mode;await mpConnect();if(a==='mpcreate'){mp.mode=mode;let deck=mpDeck(mode);mp.code=mpRandom(3).toUpperCase();mp.role='host';await fb.set(mpRef(),{mode,created:Date.now(),categories:[rand(5),rand(5),rand(5)],host:{uid:fb.uid,deck,ready:false}});mpWatch()}if(a==='mpjoin'){if(!/^[A-F0-9]{6}$/.test(code))throw Error('Enter a valid six-character code.');mp.code=code;let r=(await fb.get(mpRef())).val();if(!r)throw Error('Room not found.');if(r.host.uid===fb.uid)throw Error('Use a separate device or browser.');mp.role='guest';if(r.guest?.uid!==fb.uid){if(r.guest)throw Error('Room is full.');await fb.set(mpRef('guest'),{uid:fb.uid,deck:mpDeck(r.mode),ready:false})}mpWatch()}if(a==='mpready')await fb.set(mpRef(mp.role+'/ready'),true);if(a==='mpmove'){let j=mpResult(mp.room).round,i=Number(v),salt=mpRandom(16);sessionStorage.setItem('mp:'+mp.code+':'+j,JSON.stringify({i,salt}));await fb.set(mpRef(mp.role+'/moves/'+j),{hash:await mpHash(i,salt)})}mp.status=''}catch(e){mp.status=e.message}finally{mp.busy=false;if(tab==='Online')render()}}

function render(){save();let m=s.match,rank=tiers[leagueIndex()],h=`<div class="row"><div><h1>CAR SUPERCARD</h1><small>SEASON 04 • 1000 CARS • RANKED PACK WEIGHT 8.4</small></div><b>◈ ${s.coins}</b></div>${leaguePanel()}<nav>${['Battle','Real','Draft','Garage','Packs','Collection','Online','Save'].map(t=>btn(t+(t==='Draft'?` (${s.picks})`:''),'tab:'+t,false,tab===t?'on':'')).join('')}</nav><p class="notice">${msg}</p>`;if(tab==='Battle'){if(!m||m.done)h+=`<div class="panel"><h2>Quick battle</h2><small>Classic mode • Fictional ratings • Unlimited AI matches</small>${btn('FIND OPPONENT','start',false,'primary')}</div><h2>Your deck</h2><div class="grid">${s.deck.map(id=>card(get(id))).join('')}</div>`;else h+=`<div class="panel"><b>Round ${m.used.length+(m.result?0:1)} • ${m.a} : ${m.b}</b><h2>${stats[m.k]} challenge</h2></div>`+(m.result?`${duel(get(m.chosen),m.opp,m.k,false,true)}${btn('CONTINUE','next',false,'primary')}`:`<small>Choose a car. Opponent is hidden.</small><div class="grid">${s.deck.filter(id=>!m.used.includes(id)).map(id=>card(get(id),btn('RACE','race:'+id,false,'primary'),m.k)).join('')}</div>`)}if(tab==='Real')h+=realScreen();if(tab==='Online')h+=mpScreen();if(tab==='Draft')h+=`<h2>Draft board • ${s.picks} picks</h2><div class="draft">${s.board.map((v,i)=>btn(v?'✓':'?','pick:'+i,v||!s.picks)).join('')}</div><div class="grid" style="margin-top:12px">${latest.map(c=>card(c)).join('')}</div>`;if(tab==='Garage')h+=`<h2>Garage</h2><div class="row">${btn('Battle deck','deckmode:battle',false,deckMode==='battle'?'on':'')}${btn('Real deck','deckmode:real',false,deckMode==='real'?'on':'')}</div><p>${deckMode==='real'?'Real deck • 3 unique cars with complete stock specs':'Battle deck • 3–5 unique cars'} • ${activeDeck().length} selected</p>${garageFilters()}<small>Tune to level 20, then fuse two identical max-level cars into a PRO. Deck must have 3–5 unique cars.</small>${btn('AUTO BUILD BEST DECK','auto',false,'primary')}<div id="garage-results" class="grid">  function board(){clearTimeout(timer);phase='cards';stage.classList.remove('pack-opening');stage.innerHTML=`<small>CAR SUPERCARD • PACK OPENING</small><h2>${labels[tier]} Pack</h2><div class="pack-status" aria-live="polite">Tap a card to reveal it</div><div class="pack-slots">${cards.map((c,i)=>`<div class="pack-slot" data-slot="${i}"><button class="pack-back" data-pack="card" data-index="${i}" aria-label="Reveal card ${i+1}">◈<br><small>CARD ${i+1}</small></button></div>`).join('')}</div><div class="pack-actions"><button data-pack="next">REVEAL NEXT</button><button data-pack="all">REVEAL ALL</button><button class="primary" data-pack="done" disabled>CONTINUE</button></div>`;stage.querySelector('[data-pack="next"]').focus()}
 function reveal(i){if(phase!=='cards'||revealed.has(i)||!cards[i])return;revealed.add(i);let c=cards[i],slot=stage.querySelector(`[data-slot="${i}"]`);if(c.t>=5)slot.classList.add('high');slot.innerHTML=card(c);stage.querySelector('.pack-status').textContent=revealed.size===cards.length?`Pack complete • Best pull: ${tiers[Math.max(...cards.map(x=>x.t))]}`:`${tiers[c.t]} • ${names[c.t][c.i]} • ${revealed.size}/${cards.length}`;if(revealed.size===cards.length){stage.querySelector('[data-pack="next"]').disabled=true;stage.querySelector('[data-pack="all"]').disabled=true;stage.querySelector('[data-pack="done"]').disabled=false;stage.querySelector('[data-pack="done"]').focus()}loadPhotos()}
 overlay.addEventListener('click',e=>{let b=e.target.closest('[data-pack]');if(!b||b.disabled)return;let a=b.dataset.pack;if(a==='open'&&phase==='sealed'){phase='opening';b.disabled=true;stage.classList.add('pack-opening');timer=setTimeout(board,reduced?0:550)}else if(a==='card')reveal(+b.dataset.index);else if(a==='next')reveal(cards.findIndex((_,i)=>!revealed.has(i)));else if(a==='all')cards.forEach((_,i)=>reveal(i));else if(a==='done'&&revealed.size===cards.length)close()});

}

.coins>=50){s.coins-=50;c.lv++}if(a==='fuse'&&c&&!c.pro&&c.lv===20){let d=s.garage.find(d=>d.id!==id&&d.t===c.t&&d.i===c.i&&d.lv===20&&!d.pro);if(d){s.garage=s.garage.filter(x=>x.id!==d.id);s.deck=s.deck.map(x=>x===d.id?c.id:x);s.realDeck=s.realDeck.map(x=>x===d.id?c.id:x);if(s.deck.length<3)s.deck=bestDeck();c.pro=true;c.lv=1;msg='PRO card created!'}}}if(a==='export'){let u=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='car-supercard-save.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render()};render();</script><script>if("serviceWorker" in navigator && location.protocol === "https:"){navigator.serviceWorker.register("./sw.js", {updateViaCache:"none"}).catch(console.warn)}</script></html>
