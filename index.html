let observer;const queue=new Set();let running=false;async function drain(){if(running)return;running=true;while(queue.size){let key=queue.values().next().value;queue.delete(key);await loadPhoto(key)}running=false}function loadPhotos(){if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{for(let e of entries)if(e.isIntersecting){queue.add(e.target.dataset.photo);observer.unobserve(e.target)}drain()},{rootMargin:'150px'});document.querySelectorAll('[data-photo]').forEach(el=>observer.observe(el))}
function card(c,extra='',k=-1){let color=colors[c.t];return `<article class="card" style="--c:${color}"><strong>${tiers[c.t].toUpperCase()} ${c.pro?'★ PRO':''}</strong>${photo(c)}<h3>${names[c.t][c.i]}</h3><small>Level ${c.lv}/20</small>${stats.map((n,j)=>`<div class="stat" style="${k===j?'background:#ffffff25':''}">Game ${n}<b>${score(c,j)}</b></div>`).join('')}${realPanel(c)}${extra}</article>`}function render(){save();let m=s.match,rank=tiers[Math.min(9,Math.floor(s.w/5))],h=`<div class="row"><div><h1>CAR SUPERCARD</h1><small>SEASON 03 • REAL SPECS PREVIEW</small></div><b>◈ ${s.coins}</b></div><div class="panel row"><b>${rank} League</b><span>${s.w}W – ${s.l}L • ${s.garage.length} cards</span></div><nav>${['Battle','Real','Draft','Garage','Packs','Collection','Save'].map(t=>btn(t+(t==='Draft'?` (${s.picks})`:''),'tab:'+t,false,tab===t?'on':'')).join('')}</nav><p class="notice">${msg}</p>`;if(tab==='Battle'){if(!m||m.done)h+=`<div class="panel"><h2>Quick battle</h2><small>Classic mode • Fictional ratings • Unlimited AI matches</small>${btn('FIND OPPONENT','start',false,'primary')}</div><h2>Your deck</h2><div class="grid">${s.deck.map(id=>card(get(id))).join('')}</div>`;else h+=`<div class="panel"><b>Round ${m.used.length+(m.result?0:1)} • ${m.a} : ${m.b}</b><h2>${stats[m.k]} challenge</h2></div>`+(m.result?`<div class="grid">${card(get(m.chosen),'',m.k)}${card(m.opp,'',m.k)}</div><h2>${m.result}</h2>${btn('CONTINUE','next',false,'primary')}`:`<small>Choose a car. Opponent is hidden.</small><div class="grid">${s.deck.filter(id=>!m.used.includes(id)).map(id=>card(get(id),btn('RACE','race:'+id,false,'primary'),m.k)).join('')}</div>`)}if(tab==='Real')h+=realScreen();if(tab==='Draft')h+=`<h2>Draft board • ${s.picks} picks</h2><div class="draft">${s.board.map((v,i)=>btn(v?'✓':'?','pick:'+i,v||!s.picks)).join('')}</div><div class="grid" style="margin-top:12px">${latest.map(c=>card(c)).join('')}</div>`;if(tab==='Garage')h+=`<div class="row"><h2>Garage</h2><select id="filter"><option value="all">All rarities</option>${tiers.map((t,i)=>`<option value="${i}" ${filter==i?'selected':''}>${t}</option>`).join('')}</select></div><small>Train to level 20, then fuse two identical max-level cars into a PRO. Deck must have 3–5 cars.</small>${btn('AUTO BUILD BEST DECK','auto',false,'primary')}<div class="grid">${s.garage.filter(c=>filter==='all'||c.t==filter).sort((a,b)=>total(b)-total(a)).map(c=>card(c,btn(s.deck.includes(c.id)?'✓ In deck':'Add to deck','deck:'+c.id)+btn('Train • 50','train:'+c.id,c.lv===20||s.coins<50)+btn('Fuse PRO','fuse:'+c.id,c.pro||c.lv<20||!s.garage.some(d=>d.id!==c.id&&d.t===c.t&&d.i===c.i&&d.lv===20&&!d.pro)))).join('')}</div>`;if(tab==='Packs')h+=`<div class="panel"><h2>Standard pack</h2>3 cards • All rarities possible${btn('OPEN • 250','pack:0',s.coins<250,'primary')}</div><div class="panel"><h2>Premium pack</h2>3 cards • Rare or better${btn('OPEN • 1000','pack:2',s.coins<1000,'primary')}</div><div class="grid">${latest.map(c=>card(c)).join('')}</div>`;if(tab==='Collection'){let owned=new Set(s.garage.map(c=>c.t+'-'+c.i));h+=`<h2>Collection • ${owned.size}/500</h2><select id="filter"><option value="all">All rarities</option>${tiers.map((t,i)=>`<option value="${i}" ${filter==i?'selected':''}>${t}</option>`).join('')}</select><div class="panel">${names.map((arr,t)=>filter==='all'||filter==t?`<h3>${tiers[t]} • ${arr.filter((_,i)=>owned.has(t+'-'+i)).length}/50</h3>${arr.map((n,i)=>`<div class="stat">${esc(n)} <b>${owned.has(t+'-'+i)?'✓':'Locked'}</b></div>`).join('')}`:'').join('')}</div>`}if(tab==='Save')h+=`<div class="panel"><h2>Save your collection</h2><p>${saveOK?'Automatic local save is enabled.':'Local storage unavailable. Export your save before closing.'} Browser storage can be cleared, so keep a backup.</p>${btn('EXPORT SAVE','export',false,'primary')}<p>Restore a previously exported save:</p><input type="file" id="import" accept=".json,application/json"></div>`;h+=`<p><small>500 real model names • Classic mode fictional ratings • Real mode sourced stock specs • Online Wikimedia Commons photos (model matches may vary) • Unofficial fan prototype</small></p>`;document.querySelector('#app').innerHTML=h;loadPhotos();let f=document.querySelector('#filter');if(f)f.onchange=()=>{filter=f.value;render()};let imp=document.querySelector('#import');if(imp)imp.onchange=async()=>{try{let x=JSON.parse(await imp.files[0].text());if(!valid(x))throw Error();s=x;latest=[];msg='Save restored.'}catch(e){msg='Invalid save file.'}render()}}
document.querySelector('#app').onclick=e=>{let b=e.target.closest('[data-a]');if(!b||b.disabled)return;let [a,v]=b.dataset.a.split(':'),id=+v,c=get(id),m=s.match,busy=m&&!m.done;msg='';if(a==='tab'){tab=v;latest=[]}if(a==='realstart')realStart();if(a==='realrace')realRace(id);if(a==='realnext')realNext();if(a==='start')start();if(a==='race'&&busy&&!m.result&&!m.used.includes(id)&&s.deck.includes(id)){let x=score(c,m.k),y=score(m.opp,m.k);m.used.push(id);m.chosen=id;if(x>=y)m.a++;else m.b++;m.result=(x>=y?'ROUND WON':'ROUND LOST')+` • ${x} vs ${y}`}if(a==='next'&&busy&&m.result){if(m.a===2||m.b===2){m.done=true;let win=m.a>m.b;s.w+=win?1:0;s.l+=win?0:1;s.coins+=win?120:45;s.picks+=win?5:2;msg=win?'Victory! +120 credits, +5 picks':'Defeat. +45 credits, +2 picks'}else{m.k=rand(4);m.opp=enemy();m.result=''}}if(a==='pick'&&s.picks&&!s.board[id]){s.picks--;s.board[id]=true;latest=[pull()];if(s.board.every(Boolean))s.board.fill(false)}if(a==='pack'){let cost=id?1000:250;if(s.coins>=cost){s.coins-=cost;latest=Array.from({length:3},()=>pull(id))}}if(['auto','deck','fuse','train'].includes(a)&&busy)msg='Finish your current battle first.';else{if(a==='auto')s.deck=s.garage.slice().sort((a,b)=>total(b)-total(a)).slice(0,5).map(c=>c.id);if(a==='deck'&&c){if(s.deck.includes(id)){if(s.deck.length>3)s.deck=s.deck.filter(x=>x!==id);else msg='Keep at least three cars.'}else{if(s.deck.length===5)s.deck.shift();s.deck.push(id)}}if(a==='train'&&c&&c.lv<20&&s.coins>=50){s.coins-=50;c.lv++}if(a==='fuse'&&c&&!c.pro&&c.lv===20){let d=s.garage.find(d=>d.id!==id&&d.t===c.t&&d.i===c.i&&d.lv===20&&!d.pro);if(d){s.garage=s.garage.filter(x=>x.id!==d.id);s.deck=s.deck.filter(x=>x!==d.id);if(s.deck.length<3)s.deck=s.garage.slice().sort((a,b)=>total(b)-total(a)).slice(0,5).map(x=>x.id);c.pro=true;c.lv=1;msg='PRO card created!'}}}if(a==='export'){let u=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='car-supercard-save.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render()};render();</script><script>if("serviceWorker" in navigator && location.protocol === "https:"){navigator.serviceWorker.register("./sw.js").catch(console.warn)}</script></html>
